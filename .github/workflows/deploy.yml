name: Deploy to GitHub Pages

on:
  push:
    branches:
      # main は github-pages 環境の Allowed branches 設定で deploy がブロックされており、
      # 同時 push 時に concurrency で deploy branch のジョブを cancel してしまうため、
      # トリガーから外す。env 設定で main を許可した後に戻して良い。
      - master
      - claude/init-container-app-0RJFr
      - claude/timer-ui-updates-DBaNV
      - claude/fix-palette-box-display-36k8A
      - claude/add-photo-schedule-reading-Wx3tS
      - claude/add-gemini-voice-system-7J6VK
      - claude/new-session-ve46d
      - claude/needs-update-76b67n
  # 手動デプロイ用。GitHub App / API 経由のマージでは push イベントが発火せず
  # 自動デプロイが走らないため、Actions 画面から任意のブランチで実行できるようにする。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
