name: Deploy to GitHub Pages

on:
  push:
    branches:
      # main は github-pages 環境の Allowed branches 設定で deploy がブロックされており、
      # 同時 push 時に concurrency で deploy branch のジョブを cancel してしまうため、
      # トリガーから外す。env 設定で main を許可した後に戻して良い。
      - master
      - claude/init-container-app-0RJFr
      - claude/timer-ui-updates-DBaNV
      - claude/fix-palette-box-display-36k8A
      - claude/add-photo-schedule-reading-Wx3tS
      - claude/add-gemini-voice-system-7J6VK
      - claude/new-session-ve46d
      - claude/needs-update-76b67n
  # 手動デプロイ用。GitHub App / API 経由のマージでは push イベントが発火せず
  # 自動デプロイが走らないため、Actions 画面から任意のブランチで実行できるようにする。
  workflow_dispatch:
  # 取りこぼし防止。GitHub App 経由のマージ・push ではイベントが発火しないため、
  # 15分ごとに既定ブランチの先頭コミットを確認し、未デプロイならデプロイする。
  # （定期実行は GitHub のスケジューラが起動するのでイベント発火の制約を受けない）
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 定期実行のとき、最後に成功したデプロイと同じコミットならビルドを丸ごと省略する
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: 未デプロイのコミットがあるか判定
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.info(`event=${context.eventName} のため無条件にデプロイします`);
              core.setOutput('should_deploy', 'true');
              return;
            }
            const res = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              branch: context.ref.replace('refs/heads/', ''),
              status: 'success',
              per_page: 1,
            });
            const last = res.data.workflow_runs[0];
            const deployed = last ? last.head_sha : '';
            const should = deployed !== context.sha;
            core.info(`current=${context.sha} last_success=${deployed || '(なし)'} deploy=${should}`);
            core.setOutput('should_deploy', should ? 'true' : 'false');

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
